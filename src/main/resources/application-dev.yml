# Local development: in-process H2 database + mock header auth.
# Run with the default profile (no extra flag needed) or explicitly:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev

app:
  auth:
    mode: mock

spring:
  datasource:
    # File-based so data (and Flyway history) survives restarts; delete
    # ./data/presence-planner.mv.db to start fresh.
    url: jdbc:h2:file:./data/presence-planner;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev-migration
