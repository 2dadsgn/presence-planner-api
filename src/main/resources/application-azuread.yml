# Real deployment: PostgreSQL + Microsoft Entra ID token validation.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=azuread
# (all values below are read from environment variables so nothing
# secret needs to live in this file)

app:
  auth:
    mode: azuread
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-production-domain}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/presence_planner}
    username: ${DB_USERNAME:presence_planner}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same tenant as the Angular app's environment.msal.authority.
          issuer-uri: ${AZURE_AD_ISSUER_URI:https://login.microsoftonline.com/YOUR_TENANT_ID/v2.0}

# The Application (client) ID of THIS API's own app registration
# (create a second registration for the API, distinct from the SPA's).
# AzureAdJwtDecoderConfig uses this to reject tokens issued for a
# different application, even if they're validly signed by the same tenant.
azure-ad:
  api-audience: ${AZURE_AD_API_AUDIENCE:YOUR_API_APPLICATION_CLIENT_ID}
